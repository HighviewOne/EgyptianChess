<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#120a04"/>
      <rect width="9" height="9" fill="#1a0f06"/>
      <rect x="9" y="9" width="9" height="9" fill="#1a0f06"/>
    </pattern>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6432"/>
      <stop offset="35%" stop-color="#f5d574"/>
      <stop offset="65%" stop-color="#f5d574"/>
      <stop offset="100%" stop-color="#8a6432"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120a04"/>
      <stop offset="100%" stop-color="#0a0603"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bgGrad)"/>

  <!-- Subtle grid texture in corners -->
  <rect x="0" y="0" width="160" height="220" fill="url(#grid)" opacity="0.4"/>
  <rect x="740" y="0" width="160" height="220" fill="url(#grid)" opacity="0.4"/>

  <!-- Outer border -->
  <rect x="8" y="8" width="884" height="204" fill="none" stroke="#6e4a22" stroke-width="1"/>
  <!-- Inner border -->
  <rect x="14" y="14" width="872" height="192" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Corner ankh symbols -->
  <text x="30" y="48" font-family="serif" font-size="28" fill="#6e4a22" text-anchor="middle">☥</text>
  <text x="870" y="48" font-family="serif" font-size="28" fill="#6e4a22" text-anchor="middle">☥</text>
  <text x="30" y="196" font-family="serif" font-size="28" fill="#6e4a22" text-anchor="middle">☥</text>
  <text x="870" y="196" font-family="serif" font-size="28" fill="#6e4a22" text-anchor="middle">☥</text>

  <!-- Mini board left side (decorative) -->
  <g transform="translate(50, 68)">
    <!-- 4x4 mini board -->
    <rect x="0" y="0" width="68" height="68" fill="#6e4a22" rx="2"/>
    <rect x="0" y="0" width="17" height="17" fill="#d9b878"/>
    <rect x="34" y="0" width="17" height="17" fill="#d9b878"/>
    <rect x="17" y="17" width="17" height="17" fill="#d9b878"/>
    <rect x="51" y="17" width="17" height="17" fill="#d9b878"/>
    <rect x="0" y="34" width="17" height="17" fill="#d9b878"/>
    <rect x="34" y="34" width="17" height="17" fill="#d9b878"/>
    <rect x="17" y="51" width="17" height="17" fill="#d9b878"/>
    <rect x="51" y="51" width="17" height="17" fill="#d9b878"/>
    <!-- Pyramid glow center -->
    <rect x="17" y="17" width="34" height="34" fill="none" stroke="#f5d574" stroke-width="1" opacity="0.5"/>
    <!-- Pharaoh piece hint -->
    <text x="34" y="42" font-family="serif" font-size="20" fill="#f5d574" text-anchor="middle">♔</text>
  </g>

  <!-- Mini board right side -->
  <g transform="translate(782, 68)">
    <rect x="0" y="0" width="68" height="68" fill="#6e4a22" rx="2"/>
    <rect x="17" y="0" width="17" height="17" fill="#d9b878"/>
    <rect x="51" y="0" width="17" height="17" fill="#d9b878"/>
    <rect x="0" y="17" width="17" height="17" fill="#d9b878"/>
    <rect x="34" y="17" width="17" height="17" fill="#d9b878"/>
    <rect x="17" y="34" width="17" height="17" fill="#d9b878"/>
    <rect x="51" y="34" width="17" height="17" fill="#d9b878"/>
    <rect x="0" y="51" width="17" height="17" fill="#d9b878"/>
    <rect x="34" y="51" width="17" height="17" fill="#d9b878"/>
    <rect x="17" y="17" width="34" height="34" fill="none" stroke="#f5d574" stroke-width="1" opacity="0.5"/>
    <text x="34" y="42" font-family="serif" font-size="20" fill="#1a0f04" text-anchor="middle">♚</text>
  </g>

  <!-- Horizontal rule lines -->
  <line x1="155" y1="50" x2="745" y2="50" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <line x1="155" y1="170" x2="745" y2="170" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Main title -->
  <text x="450" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold" letter-spacing="3">Egyptian Chess</text>

  <!-- Subtitle -->
  <text x="450" y="143" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#d9b878" text-anchor="middle" letter-spacing="6">P H A R A O H ' S &nbsp; G A M E</text>

  <!-- Tagline -->
  <text x="450" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6e4a22" text-anchor="middle" letter-spacing="1">Sphinx · Ankh Resurrection · Pyramid Squares · Ancient Rules</text>
</svg>
